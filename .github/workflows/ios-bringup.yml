name: iOS bring-up (manual)
on:
  workflow_dispatch:
  push:
    branches: [dxe/controller-touch-review]
permissions:
  contents: read
concurrency:
  group: ios-bringup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    # Standard Intel capacity; still cross-compiles an arm64 iPhone device app.
    # Avoid macos-15's constrained ARM pool and paid large/xlarge labels.
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        id: sdk
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"
      - name: Cache pinned SDL build
        id: sdl-cache
        uses: actions/cache/restore@v4
        with:
          path: .ios-deps
          key: ios-sdl-3.2.30-static-v1-${{ runner.arch }}-${{ steps.sdk.outputs.version }}
      - name: Touch ownership and private profile tests
        run: |
          clang++ -std=c++17 tests/ios/touch_state.cpp -o /tmp/touch-state
          /tmp/touch-state
          clang++ -std=c++17 -I. tests/ios/touch_glyphs.cpp -o /tmp/touch-glyphs
          /tmp/touch-glyphs
          clang++ -std=c++17 tests/ios/mobile_presentation.cpp -o /tmp/mobile-presentation
          /tmp/mobile-presentation
          python3 -m unittest discover -s tests/ios -p 'test_*.py' -v
      - name: Compile iPhone device app
        run: |
          set -o pipefail
          ports/ios/build.sh 2>&1 | tee ios-build.log
      - name: Preserve successful SDL dependency even if engine fails
        if: always() && steps.sdl-cache.outputs.cache-hit != 'true' && hashFiles('.ios-deps/install/lib/cmake/SDL3/SDL3Config.cmake') != '' && hashFiles('.ios-deps/install/lib/libSDL3.a') != ''
        uses: actions/cache/save@v4
        with:
          path: .ios-deps
          key: ${{ steps.sdl-cache.outputs.cache-primary-key }}
      - name: Save relink objects for licensing and debugging
        if: success()
        run: |
          find build-ios -type f \( -name '*.o' -o -name '*.a' \) -print > relink-files.txt
          test -s relink-files.txt
          tar -czf ios-relink-objects.tar.gz -T relink-files.txt
      - name: Keep internal build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-bringup-${{ github.sha }}
          path: |
            dist/*.ipa
            ios-build.log
            ios-relink-objects.tar.gz
            relink-files.txt
          if-no-files-found: error
          retention-days: 14
